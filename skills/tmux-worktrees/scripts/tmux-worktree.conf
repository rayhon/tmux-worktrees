# tmux-worktree.conf — repo-local tmux config for the worktree dev session.
# Loaded by scripts/tmux-worktrees.sh via `tmux -L wt -f <this>`.
# Lives in the repo, so anyone who clones gets the same UX. Your personal
# ~/.tmux.conf is NOT used by this session (we run on a separate tmux server).

# --- basics -------------------------------------------------------------------
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# --- pane navigation: Alt+arrow (auto-zoom: stay zoomed while switching) ------
bind -n M-Left  if -F '#{window_zoomed_flag}' 'select-pane -L; resize-pane -Z' 'select-pane -L'
bind -n M-Right if -F '#{window_zoomed_flag}' 'select-pane -R; resize-pane -Z' 'select-pane -R'
bind -n M-Up    if -F '#{window_zoomed_flag}' 'select-pane -U; resize-pane -Z' 'select-pane -U'
bind -n M-Down  if -F '#{window_zoomed_flag}' 'select-pane -D; resize-pane -Z' 'select-pane -D'

# --- window/worktree switching: Shift+arrow + Alt+digit -----------------------
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# --- popup menu picker for current window's panes -----------------------------
bind -n M-m choose-tree -Zw -F "#{?pane_active,▶ ,  }#{@role}  #{pane_current_command}"

# --- worktree picker: Alt+w opens a tree of all worktree windows with previews
bind -n M-w choose-tree -Zw -F "#{window_index}: #{window_name} [#{window_panes} panes]"

# --- pane border labels (CLAUDE / MCP / AGENT / WEB) --------------------------
# Display @role (set by tmux-worktrees.sh) so programs renaming the pane title
# don't change the visible label.
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=yellow#,bold],#[fg=cyan]}#{?#{@role},#{@role},#{pane_title}} "

# --- clickable status bar buttons --------------------------------------------
# status-right is set dynamically by tmux-worktrees.sh from tmux-worktree.json
# so any repo can define its own labels without touching this file.
set -g status-left  "#[fg=green]#S "
set -g status-right "  %H:%M "
set -g status-right-length 200
set -g status-style "bg=default fg=white"
set -g window-status-current-style "fg=yellow,bold"

# Click handler: if a user range was clicked, dispatch to the repo helper
# (which the launcher exposes via TMUX_WT_JUMP). Otherwise fall back to
# normal window-click behavior.
bind -n MouseDown1Status if -F '#{!=:#{mouse_status_range},}' 'run-shell "$TMUX_WT_JUMP #{mouse_status_range}"' 'select-window -t=#{mouse_window}'

# --- reload config in-session -------------------------------------------------
bind r run-shell "tmux -L wt source-file '$TMUX_WT_CONF'" \; display-message "tmux config reloaded"
