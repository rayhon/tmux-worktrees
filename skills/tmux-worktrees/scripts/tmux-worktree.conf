# tmux-worktree.conf — repo-local tmux config for the worktree dev session.
# Loaded by scripts/tmux-worktrees.sh via `tmux -L wt -f <this>`.
# Lives in the repo, so anyone who clones gets the same UX. Your personal
# ~/.tmux.conf is NOT used by this session (we run on a separate tmux server).

# --- basics -------------------------------------------------------------------
# Mouse ON: the wheel scrolls pane/Claude history (tmux owns the alternate
# screen, so scrollback must go through tmux copy-mode — the wheel enters it),
# drag-select copies to the system clipboard (see the mouse-copy section
# below), the status bar is clickable, and the M-w / M-m label popups respond
# to clicks. Paste with your terminal's paste (Cmd+V on macOS) — it types into
# the active pane regardless of mouse mode.
#
# Need the terminal's NATIVE selection instead (select across panes, terminal
# find, etc.)? Toggle mouse OFF with Ctrl+b m, select/copy natively, Ctrl+b m
# to turn it back on. Or, while mouse stays ON, hold your terminal's bypass key
# and drag: iTerm2 / Terminal.app → Option (⌥); Alacritty / Ghostty → Shift.
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# --- mouse copy: keep selection visible + push to system clipboard -----------
# Tmux mouse copy is never as smooth as native terminal selection. For the
# best UX, hold your terminal's bypass key while dragging:
#   iTerm2 / Terminal.app  → Option (⌥) + drag
#   Alacritty / Ghostty    → Shift + drag
# That gives you native selection + ⌘C / Ctrl-Shift-C.
#
# For when you do use tmux's own selection, the bindings below pipe the
# selection through pbcopy / wl-copy / xclip on macOS / Wayland / X11.
#
# IMPORTANT: set-clipboard is OFF. Enabling it (OSC 52) lets child processes
# in the pane write to the system clipboard, which can wipe your clipboard
# when pasting if the inner process sends a malformed/empty OSC 52 sequence.
# pbcopy on mouse drag is enough for outbound copy; we don't need OSC 52.
set -g set-clipboard off

# Drag to select + copy. Without this, MouseDrag1Pane is unbound so no real
# selection ever begins — the highlight flashes during the drag and vanishes on
# release with an EMPTY buffer (the [ -n "$b" ] guard then copies nothing). That
# is the "yellow selection drag+release → gone, nothing copied" bug.
# `copy-mode -M` enters copy mode AND begins the mouse-drag selection in one
# motion; MouseDragEnd (below) pipes the result to the system clipboard. When
# the pane's app handles mouse itself (mouse_any_flag — a TUI), forward instead.
bind -n MouseDrag1Pane if -F '#{mouse_any_flag}' 'send -M' 'copy-mode -M'

# Pipe selection to system clipboard, but ONLY if it's non-empty.
# A bare `pbcopy` reading empty stdin wipes the clipboard, which is what
# caused the "copy URL → tmux click → clipboard empty" bug. Guard with a
# shell test so empty selections leave the existing clipboard alone.
#
# Plain clipboard command — NO `sh -c '... $b ...'` wrapper. tmux expands $b
# inside double-quoted command args at parse time, so the old guard collapsed
# to `[ -n "" ]` and copied NOTHING — the real reason mouse-copy never worked.
# MouseDragEnd1Pane only fires after an actual drag, so the selection is never
# empty here; no clipboard-wipe risk, no guard needed.
if-shell "command -v pbcopy" {
  bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel pbcopy
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel pbcopy
} {
  if-shell "command -v wl-copy" {
    bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel wl-copy
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel wl-copy
  } {
    if-shell "command -v xclip" {
      bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
      bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
    }
  }
}

# --- pane navigation: Alt+Left/Right cycles through ALL panes in the window --
# Each press moves to the previous/next pane by index (CLAUDE → MCP → AGENT →
# WEB → CLAUDE…), regardless of layout. Stays zoomed if the window is zoomed.
bind -n M-Left  if -F '#{window_zoomed_flag}' 'select-pane -t :.-; resize-pane -Z' 'select-pane -t :.-'
bind -n M-Right if -F '#{window_zoomed_flag}' 'select-pane -t :.+; resize-pane -Z' 'select-pane -t :.+'
# Up/Down do the same flat cycle (in case Left/Right doesn't get through).
bind -n M-Up    if -F '#{window_zoomed_flag}' 'select-pane -t :.-; resize-pane -Z' 'select-pane -t :.-'
bind -n M-Down  if -F '#{window_zoomed_flag}' 'select-pane -t :.+; resize-pane -Z' 'select-pane -t :.+'

# --- window/worktree switching: Shift+arrow + Alt+digit -----------------------
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# --- popup menu picker for current window's panes -----------------------------
bind -n M-m choose-tree -Zw -F "#{?pane_active,▶ ,  }#{@role}  #{pane_current_command}"

# --- worktree picker: Alt+w opens a tree of all worktree windows with previews
bind -n M-w choose-tree -Zw -F "#{window_index}: #{window_name} [#{window_panes} panes]"

# --- pane border labels (CLAUDE / MCP / AGENT / WEB) --------------------------
# Display @role (set by tmux-worktrees.sh) so programs renaming the pane title
# don't change the visible label.
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=yellow#,bold],#[fg=cyan]}#{?#{@role},#{@role},#{pane_title}} "

# --- track active pane's @role in a session-level user option ----------------
# The status bar reads `@active_role` to color the matching label yellow.
set-hook -g pane-focus-in   "set -gF @active_role '#{@role}'"
set-hook -g after-select-pane "set -gF @active_role '#{@role}'"

# --- highlight active pane: dim inactive pane content so the active pops -----
# Inactive panes get a dim gray foreground; active pane uses defaults. Combined
# with the yellow border above, it's immediately obvious which pane is active.
set -g window-active-style "fg=default,bg=default"
set -g window-style "fg=colour244,bg=default"
set -g pane-active-border-style "fg=yellow,bold"
set -g pane-border-style "fg=colour240"

# --- clickable status bar buttons --------------------------------------------
# status-right is set dynamically by tmux-worktrees.sh from tmux-worktree.json
# so any repo can define its own labels without touching this file.
set -g status-left  "#[fg=green]#S "
set -g status-right "  %H:%M "
set -g status-right-length 200
set -g status-style "bg=default fg=white"
set -g window-status-current-style "fg=yellow,bold"

# Click handler: if a user range was clicked, dispatch to the repo helper
# (which the launcher exposes via TMUX_WT_JUMP). Otherwise fall back to
# normal window-click behavior.
bind -n MouseDown1Status if -F '#{!=:#{mouse_status_range},}' 'run-shell "$TMUX_WT_JUMP #{mouse_status_range}"' 'select-window -t=#{mouse_window}'

# --- toggle mouse mode --------------------------------------------------------
# Ctrl+b m flips mouse on/off. Turn off for clean native iTerm2 copy/paste,
# turn back on for clickable status-bar labels / drag-to-resize panes.
bind m if -F '#{mouse}' 'set -g mouse off; display-message "mouse: OFF (native selection)"' 'set -g mouse on; display-message "mouse: ON (clickable UI)"'

# --- reload config in-session -------------------------------------------------
bind r run-shell "tmux -L wt source-file '$TMUX_WT_CONF'" \; display-message "tmux config reloaded"

# --- prefix + R: re-run this pane's start command ----------------------------
# tmux-worktrees.sh persists each service pane's launch command as the
# @start_cmd pane option. Useful after Ctrl+C'ing a dev server: hit `prefix R`
# and the pane re-runs whatever the launcher first sent (env exports + install
# wait + dev command). Sends Ctrl+C first so any partial input is cleared,
# then writes the command and Enter. Falls back gracefully on manually-split
# panes that have no saved command.
bind R if -F '#{!=:#{@start_cmd},}' \
  'send-keys C-c; send-keys "#{@start_cmd}" Enter; display-message "restarted #{@role}"' \
  'display-message "no @start_cmd on this pane"'
